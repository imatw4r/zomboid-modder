[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zomboid-modder"
version = "0.1.0"
description = "Terminal UI for managing Project Zomboid dedicated server mods and settings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bartek.krzys+github@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "textual>=0.79",
    "asyncssh>=2.17",
    "lupa>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
    "ruff>=0.5",
]

[project.scripts]
zomboid-modder = "zomboid_modder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zomboid_modder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

